name: Tag Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyside6-fluent-widgets nuitka zstandard

      - name: Build executable
        run: |
          python -m nuitka --standalone --onefile --enable-plugin=pyside6 --windows-icon-from-ico=logo.ico --include-data-file=logo.ico=logo.ico --output-dir=dist --remove-output main.py
          Move-Item -Path dist/main.exe -Destination dist/Grsai-Banana-windows-x64.exe -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grsai-Banana-windows-x64
          path: dist/Grsai-Banana-windows-x64.exe
          if-no-files-found: error

  build-linux-rpm:
    name: Build Linux RPM x64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential patchelf ccache ruby ruby-dev rpm
          sudo gem install --no-document fpm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyside6-fluent-widgets nuitka zstandard

      - name: Build Linux binary and package RPM
        shell: bash
        run: |
          python -m nuitka --standalone --onefile --enable-plugin=pyside6 --include-data-file=logo.ico=logo.ico --output-dir=dist --remove-output main.py

          if [ -f dist/main.bin ]; then
            mv dist/main.bin dist/grsai-banana
          elif [ -f dist/main ]; then
            mv dist/main dist/grsai-banana
          else
            echo "Cannot find Nuitka output in dist/"
            ls -la dist || true
            exit 1
          fi

          chmod +x dist/grsai-banana
          version="${GITHUB_REF_NAME#v}"
          version="${version//-/.}"

          fpm -s dir -t rpm \
            -n grsai-banana \
            -v "${version}" \
            --architecture x86_64 \
            --license MIT \
            --description "Grsai Banana Image Generator desktop client" \
            --url "https://github.com/${{ github.repository }}" \
            dist/grsai-banana=/usr/local/bin/grsai-banana \
            logo.ico=/usr/share/grsai-banana/logo.ico

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grsai-Banana-linux-rpm-x64
          path: ./*.rpm
          if-no-files-found: error

  create-release:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs: [build-windows-x64, build-linux-rpm]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.exe
            release-assets/**/*.rpm
